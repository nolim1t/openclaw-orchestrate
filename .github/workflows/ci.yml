# CI additions for openclaw-orchestrate — resilience smoke tests
#
# Three new jobs, designed to slot into the existing .github/workflows/ci.yml
# (paste below the existing jobs, keep the top-level `name:`/`on:`/`concurrency:`).
#
# Draft status: REVIEW BEFORE MERGING — marked points need verifying against
# the actual generator output (see "Review checklist" at the bottom).
#
# Design notes on the non-obvious choices:
#
#   Idempotence uses the SAME dir run twice (snapshot in between), not two
#   sibling dirs. Reason: the generator likely embeds absolute paths derived
#   from OPENCLAW_STATE_DIR — two different dirs would diff-dirty for that
#   reason alone. Same-dir-twice isolates pure temporal nondeterminism.
#
#   Healthcheck semantics extracts the `test:` expression from the GENERATED
#   compose file rather than duplicating the string in the workflow — so the
#   test fails loudly if someone edits the template without updating CI (or
#   vice versa). It evaluates the expression against a FAKE state dir on the
#   runner; no Docker needed, milliseconds of runtime.
#
#   Container health transition is opt-in (workflow_dispatch only): it's the
#   only test exercising what Docker actually does with the healthcheck, but
#   it depends on the built image staying up with placeholder creds, which
#   hasn't been proven yet (see checklist).

jobs:

  # ---------------------------------------------------------------------
  # Generator determinism: run twice into the SAME state dir, diff trees.
  # This is the CI guard for "rerunning setup must not change the stack".
  # ---------------------------------------------------------------------
  generator-idempotence:
    name: Generator idempotence (same dir, twice)
    runs-on: ubuntu-latest
    env:
      OPENCLAW_STATE_DIR: ${{ github.workspace }}/.ci-state/idempotence
      NANOGPT_API_KEY: ci-placeholder-key
      OPENCLAW_GATEWAY_TOKEN: ci-placeholder-token
      AGENT_ROSTER: seer,guardian,sage
      PERSONALITY_PRESET: default
    steps:
      - uses: actions/checkout@v4

      - name: First generation + snapshot
        run: |
          set -euo pipefail
          ./scripts/setup-openclaw-triad.sh --docker
          cp -a "$OPENCLAW_STATE_DIR" "$RUNNER_TEMP/gen-snapshot"

      - name: Second generation (same dir, same env)
        run: ./scripts/setup-openclaw-triad.sh --docker

      - name: Diff snapshot vs regenerated tree
        run: |
          set -euo pipefail
          # REVIEW POINT 1: if the generator legitimately embeds entropy
          # (random tokens, timestamps), extend the exclusion list below
          # — or better, make the generator deterministic. Entropy in
          # generated output is what turns laptop->VPS migration into a
          # "diff the stacks by hand" exercise.
          EXCLUDES=(
            --exclude='*.sqlite*'   # runtime state, if any leaks into generation
            --exclude='*.log'
          )
          if ! diff -r "${EXCLUDES[@]}" \
               "$RUNNER_TEMP/gen-snapshot" "$OPENCLAW_STATE_DIR" \
               > "$RUNNER_TEMP/idempotence.diff"; then
            cat "$RUNNER_TEMP/idempotence.diff"
            echo "::error::generator output differs between identical runs" >&2
            exit 1
          fi
          echo "OK: byte-identical regeneration"

  # ---------------------------------------------------------------------
  # Healthcheck semantics: extract the `test:` expression from the
  # GENERATED compose file and assert its behavior in 4 scenarios.
  # Runs without Docker; guards the heartbeat template change.
  # ---------------------------------------------------------------------
  healthcheck-semantics:
    name: Healthcheck expression semantics
    runs-on: ubuntu-latest
    env:
      OPENCLAW_STATE_DIR: ${{ github.workspace }}/.ci-state/healthcheck
      NANOGPT_API_KEY: ci-placeholder-key
      OPENCLAW_GATEWAY_TOKEN: ci-placeholder-token
      AGENT_ROSTER: seer,guardian,sage
      PERSONALITY_PRESET: default
    steps:
      - uses: actions/checkout@v4

      - name: Generate stack
        run: ./scripts/setup-openclaw-triad.sh --docker

      - name: Guard: generated compose actually contains heartbeat check
        # REVIEW POINT 2: this intentionally FAILS until the heartbeat-aware
        # healthcheck is promoted into the generator template (v3.4). If you
        # merge this job before the template change, delete this step.
        run: |
          set -euo pipefail
          grep -q 'heartbeat' "$OPENCLAW_STATE_DIR/docker-compose.yml" || {
            echo "::error::generated healthcheck lacks the heartbeat clause — promote the template change first" >&2
            exit 1
          }

      - name: Extract healthcheck expression into a runnable script
        run: |
          set -euo pipefail
          # PyYAML ships preinstalled on ubuntu-latest. REVIEW POINT 3:
          # adjust the service key if it's not literally 'openclaw-triad'.
          python3 - <<'PY' > "$RUNNER_TEMP/hcheck.sh"
          import os, yaml
          d = os.environ["OPENCLAW_STATE_DIR"]
          doc = yaml.safe_load(open(os.path.join(d, "docker-compose.yml")))
          hc = doc["services"]["openclaw-triad"]["healthcheck"]["test"]
          expr = hc[1] if isinstance(hc, list) else hc
          # Substitute the compose variable with our fake state dir so the
          # expression is runnable on the runner filesystem.
          print("#!/bin/sh")
          print(expr.replace("${CONTAINER_STATE_DIR}", os.environ["FAKE_STATE"]))
          PY
          chmod +x "$RUNNER_TEMP/hcheck.sh"
          echo "--- extracted healthcheck ---"; cat "$RUNNER_TEMP/hcheck.sh"
        env:
          FAKE_STATE: ${{ runner.temp }}/fake-state

      - name: Scenario 1 — inert before first stamp (no heartbeat file)
        run: |
          set -euo pipefail
          mkdir -p "$FAKE_STATE"
          echo '{}' > "$FAKE_STATE/openclaw.json"
          "$RUNNER_TEMP/hcheck.sh"   # must PASS (exit 0)
        env:
          FAKE_STATE: ${{ runner.temp }}/fake-state

      - name: Scenario 2 — fresh stamp passes
        run: |
          set -euo pipefail
          date +%s > "$FAKE_STATE/heartbeat"
          "$RUNNER_TEMP/hcheck.sh"   # must PASS
        env:
          FAKE_STATE: ${{ runner.temp }}/fake-state

      - name: Scenario 3 — stale stamp (10 min old) fails
        run: |
          set -euo pipefail
          echo $(( $(date +%s) - 600 )) > "$FAKE_STATE/heartbeat"
          if "$RUNNER_TEMP/hcheck.sh"; then
            echo "::error::stale heartbeat passed the healthcheck — regression" >&2
            exit 1
          fi
        env:
          FAKE_STATE: ${{ runner.temp }}/fake-state

      - name: Scenario 4 — missing openclaw.json still fails (original guarantee)
        run: |
          set -euo pipefail
          mv "$FAKE_STATE/openclaw.json" "$FAKE_STATE/openclaw.json.bak"
          if "$RUNNER_TEMP/hcheck.sh"; then
            echo "::error::missing config passed the healthcheck — original check weakened" >&2
            exit 1
          fi
          mv "$FAKE_STATE/openclaw.json.bak" "$FAKE_STATE/openclaw.json"
        env:
          FAKE_STATE: ${{ runner.temp }}/fake-state

  # ---------------------------------------------------------------------
  # Opt-in: build the generated image, run it, and observe Docker's ACTUAL
  # health transitions (healthy -> unhealthy on stale heartbeat).
  #
  # Kept behind workflow_dispatch because it (a) costs real CI minutes and
  # (b) depends on the image staying up with placeholder creds, which is
  # unproven — see REVIEW POINT 4. Promote to always-on once it's green
  # twice in a row.
  # ---------------------------------------------------------------------
  container-health-transition:
    name: Container health transition (opt-in)
    runs-on: ubuntu-latest
    needs: [validate-make, generator-idempotence, healthcheck-semantics]
    if: github.event_name == 'workflow_dispatch'
    env:
      OPENCLAW_STATE_DIR: ${{ github.workspace }}/.ci-state/health-transition
      NANOGPT_API_KEY: ci-placeholder-key
      OPENCLAW_GATEWAY_TOKEN: ci-placeholder-token
      AGENT_ROSTER: seer,guardian,sage
      PERSONALITY_PRESET: default
    steps:
      - uses: actions/checkout@v4

      - name: Generate + build stack
        run: |
          set -euo pipefail
          ./scripts/setup-openclaw-triad.sh --docker
          cd "$OPENCLAW_STATE_DIR"
          docker compose --env-file docker.env build

      - name: Bring stack up
        run: |
          set -euo pipefail
          cd "$OPENCLAW_STATE_DIR"
          docker compose --env-file docker.env up -d

      - name: Wait for healthy (within start_period + margin)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 240))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' openclaw-triad)" = "healthy" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker inspect --format '{{json .State.Health}}' openclaw-triad | jq .
              echo "::error::container never reached healthy" >&2
              exit 1
            fi
            sleep 5
          done
          echo "healthy after ${SECONDS}s"

      - name: Stamp STALE heartbeat from the host side; expect unhealthy
        run: |
          set -euo pipefail
          cd "$OPENCLAW_STATE_DIR"
          # REVIEW POINT 4: assumes the host-side bind dir is exported into
          # docker.env as OPENCLAW_HOST_STATE_DIR. If the generator spells it
          # differently, adjust the grep below. Also verifies the heartbeat
          # path is inside the (only) writable bind mount — if this write
          # fails from the host, the mount mapping is wrong.
          HOST_STATE="$(grep -E '^OPENCLAW_HOST_STATE_DIR=' docker.env | cut -d= -f2)"
          echo $(( $(date +%s) - 600 )) > "$HOST_STATE/heartbeat"

          # Timeout budget: interval x retries + margin.
          # Current template: 30s x 3 = 90s; the heartbeat template bumps
          # interval to 60s => 180s budget. REVIEW POINT 5: keep this in
          # sync with the generated healthcheck timings.
          deadline=$((SECONDS + 240))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' openclaw-triad)" = "unhealthy" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker inspect --format '{{json .State.Health}}' openclaw-triad | jq .
              echo "::error::stale heartbeat did NOT flip container to unhealthy" >&2
              exit 1
            fi
            sleep 10
          done
          echo "flipped to unhealthy after ${SECONDS}s — healthcheck is live, not decorative"

      - name: Teardown (always)
        if: always()
        run: |
          cd "$OPENCLAW_STATE_DIR"
          docker compose --env-file docker.env down -v || true

